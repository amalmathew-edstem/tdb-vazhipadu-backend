spring:
  application:
    name: tdb-vazhipadu-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:vazhipadu;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        serialization-mode: via_dto

management:
  endpoints:
    web:
      exposure:
        include: health,info
