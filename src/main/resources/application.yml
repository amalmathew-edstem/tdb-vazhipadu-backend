spring:
  application:
    name: tdb-vazhipadu-backend
  datasource:
    url: jdbc:h2:mem:vazhipadu;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        serialization-mode: via_dto
        max-page-size: 100

tdb:
  security:
    jwt-secret: ${TDB_JWT_SECRET:}
    token-ttl: 8h
    staff:
      - username: ${TDB_STAFF_USERNAME:}
        password-hash: ${TDB_STAFF_PASSWORD_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
